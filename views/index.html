<!DOCTYPE html>
<html>
<body>
  <input type="text" id="dateInput" placeholder="Data ou timestamp">
  <button onclick="getTimestamp()">Converter</button>
  <div id="result"></div>

  <script>
    async function getTimestamp() {
      const response = await fetch(`/api/${document.getElementById('dateInput').value}`);
      const data = await response.json();
      document.getElementById('result').innerHTML = JSON.stringify(data);
    }
  </script>
</body>
</html>
